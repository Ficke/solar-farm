name: Reserve recommendation

# Weekly: turn the Jackery telemetry into a suggested Self-powered reserve and
# post it as a comment on the "Reserve recommendation" issue.
on:
  schedule:
    - cron: "0 17 * * 0" # Sundays, 10am Pacific
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./planner
      - name: Fetch telemetry
        run: |
          git fetch --depth 1 origin gh-pages || exit 0
          git worktree add out origin/gh-pages
      - name: Recommend
        working-directory: planner
        run: python -m planner.main recommend --data ../out/data --out ../recommendation.md
      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f recommendation.md ] || exit 0
          title="Reserve recommendation"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file recommendation.md
          else
            gh issue comment "$num" --body-file recommendation.md
          fi
