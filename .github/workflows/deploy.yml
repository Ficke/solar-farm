name: Deploy

# Builds the server image and rolls it out to both Cloud Run services on
# every push to main that changes the server, the planner or the dashboard.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "planner/**"
      - "web/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: us-west1
  IMAGE: us-west1-docker.pkg.dev/solar-farm-510518/solar-farm/server:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/644948460803/locations/global/workloadIdentityPools/github/providers/solar-farm
          service_account: github-deploy@solar-farm-510518.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Roll out
        run: |
          for svc in solar-edge solar-web; do
            gcloud run services update "$svc" --region "$REGION" --image "$IMAGE" --quiet
          done
