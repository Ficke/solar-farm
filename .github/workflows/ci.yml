name: CI

# Deploy and Infra reuse these checks on the commit they will ship.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q

  # Emulator tests exercise real storage behavior; other tests use MemoryStore.
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          npx -y firebase-tools@15 emulators:exec --only firestore --project demo-solar-farm
          "uv run pytest -q server/tests/test_firestore.py -rs"

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false
      - run: tofu fmt -check -recursive infra
      - run: tofu -chdir=infra init -backend=false
      - run: tofu -chdir=infra/bootstrap init -backend=false
      # Init may rewrite missing or stale locks; require committed, current files.
      - name: Provider lock files are committed and current
        run: |
          if [ -n "$(git status --porcelain -- infra)" ]; then
            echo "::error::Provider lock files are missing or stale. Run 'just lock' and commit the result."
            git status --porcelain -- infra
            for dir in infra infra/bootstrap; do
              tofu -chdir="$dir" providers lock -platform=linux_amd64 -platform=darwin_arm64 >/dev/null
              echo "::group::$dir/.terraform.lock.hcl"
              cat "$dir/.terraform.lock.hcl"
              echo "::endgroup::"
            done
            exit 1
          fi
      - run: tofu -chdir=infra validate
      - run: tofu -chdir=infra/bootstrap validate

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
