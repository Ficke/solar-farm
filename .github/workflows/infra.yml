name: Infra

# Applies infra/ (everything in the Google Cloud project except the one-time
# bootstrap) on every push to main that touches it. Authenticates with
# Workload Identity Federation, so no Google key is stored in GitHub. CI runs
# first on the same commit.
on:
  push:
    branches: [main]
    paths: ["infra/**", "!infra/bootstrap/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  apply:
    needs: ci
    runs-on: ubuntu-latest
    # Shared with Deploy so an apply and a rollout never touch the services at once.
    concurrency:
      group: production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_dashboard_users: ${{ vars.DASHBOARD_USERS }}
      TF_VAR_iap_oauth_client_id: ${{ secrets.IAP_OAUTH_CLIENT_ID }}
      TF_VAR_iap_oauth_client_secret: ${{ secrets.IAP_OAUTH_CLIENT_SECRET }}
      TF_VAR_watttime_username: ${{ secrets.WATTTIME_USERNAME || secrets.WATTTIME_USER }}
      TF_VAR_watttime_password: ${{ secrets.WATTTIME_PASSWORD }}
      TF_VAR_jackery_email: ${{ secrets.JACKERY_EMAIL }}
      TF_VAR_jackery_password: ${{ secrets.JACKERY_PASSWORD }}
      TF_VAR_jackery_sn: ${{ secrets.JACKERY_SN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Both created by infra/bootstrap; neither is secret.
          workload_identity_provider: projects/644948460803/locations/global/workloadIdentityPools/github/providers/solar-farm
          service_account: github-infra@solar-farm-510518.iam.gserviceaccount.com
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false
      - run: tofu init -lockfile=readonly
      - run: tofu plan -out=tfplan
      - run: tofu apply tfplan
