name: Firestore

# FirestoreStore against the Firestore emulator. The rest of the tests use
# MemoryStore and run in CI.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          npx -y firebase-tools@15 emulators:exec --only firestore --project demo-solar-farm
          "uv run pytest -q server/tests/test_firestore.py -rs"
