name: Plan

# Every 30 minutes: read the WattTime forecast, write plan.json, record a
# Jackery telemetry sample, and publish both to the gh-pages branch, which
# GitHub Pages serves to the plug.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add out origin/gh-pages
          else
            git worktree add --orphan -b gh-pages out
          fi

      - name: Build plan
        env:
          WATTTIME_USERNAME: ${{ secrets.WATTTIME_USERNAME || secrets.WATTTIME_USER }}
          WATTTIME_PASSWORD: ${{ secrets.WATTTIME_PASSWORD }}
          JACKERY_EMAIL: ${{ secrets.JACKERY_EMAIL }}
          JACKERY_PASSWORD: ${{ secrets.JACKERY_PASSWORD }}
          JACKERY_SN: ${{ secrets.JACKERY_SN }}
        working-directory: planner
        run: uv run --no-sync python -m planner.main plan --site ../out --data ../out/data

      - name: Publish
        working-directory: out
        run: |
          cp ../site/index.html .
          touch .nojekyll
          git config user.name "solar-farm-bot"
          git config user.email "solar-farm-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "plan $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin HEAD:gh-pages
