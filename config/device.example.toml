# Copy to git-ignored config/device.toml and set the plug address.

# The plug's address on your Wi-Fi (Shelly app > device > Device information).
host = "192.168.1.50"

# Use solar-edge's `plug_base_url` from the Infra output for both endpoints.
# Reports return the current plan; plan_url provides recovery requests.
plan_url = "https://solar-edge-v5whpbqqpq-uw.a.run.app/plug/plan"
report_url = "https://solar-edge-v5whpbqqpq-uw.a.run.app/plug/report"

timezone = "America/Los_Angeles"

# Omit the admin password on first deploy; deploy.py generates and saves it.
# password = ""

# Override script defaults as needed; peak times use minutes after local midnight.
[tuning]
threshold = 25
peakStart = 960       # Start the peak at 16:00.
peakEnd = 1260        # End the peak at 21:00.
