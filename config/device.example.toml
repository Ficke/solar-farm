# Copy to config/device.toml (git-ignored) and fill in.

# The plug's address on your Wi-Fi (Shelly app > device > Device information).
host = "192.168.1.50"

# The solar-edge service (`plug_base_url` in the Infra run's output). The plug
# reads its plan from one and reports to the other every minute, which is what
# the dashboard shows. deploy.py also stores the plug key on the plug.
plan_url = "https://solar-edge-v5whpbqqpq-uw.a.run.app/plug/plan"
report_url = "https://solar-edge-v5whpbqqpq-uw.a.run.app/plug/report"

timezone = "America/Los_Angeles"

# The plug's local password (user "admin"). Leave it out: the first deploy
# turns authentication on and writes a generated one here.
# password = ""

# Optional overrides for the script's defaults (minutes after local midnight,
# seconds for ages). Leave out anything you don't want to change.
[tuning]
threshold = 25        # live-index percentile at or below which grid is on
peakStart = 960       # 16:00, PG&E E-TOU-C peak start
peakEnd = 1260        # 21:00, peak end
