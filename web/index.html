<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Solar Farm</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23eda100'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.svelte.ts).
      let mode;
      try {
        mode = localStorage.getItem("theme");
      } catch {}
      document.documentElement.dataset.theme =
        mode === "light" || mode === "dark"
          ? mode
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
