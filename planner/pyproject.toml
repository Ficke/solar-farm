[project]
name = "solar-farm-planner"
version = "0.1.0"
description = "Picks clean grid windows for the Jackery and records Jackery telemetry"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "socketry>=0.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
