[project]
name = "solar-farm-planner"
version = "0.1.0"
description = "Picks clean grid windows for the Jackery and records Jackery telemetry"
requires-python = ">=3.14"
dependencies = [
  "requests>=2.32",
  "socketry>=0.2.4",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "planner"
